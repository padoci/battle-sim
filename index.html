<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Draft, simulate, pressure-test. AI-vs-AI Gen 9 OU teambuilding in your browser. Direction, not gospel."
    />
    <meta name="theme-color" content="#5B34D6" />

    <!-- Unfurls. This gets pasted into Discord and Reddit more than it gets
         found by search, and without these a share is a bare URL: no title,
         no blurb, no picture of the thing that makes it worth clicking.
         og:image has to be absolute — relative paths fail on most unfurlers,
         which also means PR previews unfurl with production's image. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Team Preview" />
    <meta property="og:url" content="https://battle-sim-eo1.pages.dev/" />
    <meta property="og:title" content="Team Preview: draft, simulate, pressure-test" />
    <meta
      property="og:description"
      content="AI-vs-AI Gen 9 OU simulation, in your browser. Draft a team and take it through a six-battle gauntlet, or paste one and see its worst matchups. Direction, not gospel."
    />
    <meta property="og:image" content="https://battle-sim-eo1.pages.dev/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Team Preview: build the team, we'll pressure-test it." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Team Preview: draft, simulate, pressure-test" />
    <meta
      name="twitter:description"
      content="AI-vs-AI Gen 9 OU simulation, in your browser. Draft a team and take it through a six-battle gauntlet, or paste one and see its worst matchups."
    />
    <meta name="twitter:image" content="https://battle-sim-eo1.pages.dev/og.png" />
    <!-- The draft screen fires off ~10 parallel lookups to TCGdex for card
         art; warming the connection (DNS + TLS) before those requests fire
         shaves a round trip off each one. wsrv.nl is the resizing proxy every
         one of those images is actually fetched through (see
         resizedCardArtUrl), so it needs warming most of all. -->
    <link rel="preconnect" href="https://wsrv.nl" crossorigin />
    <link rel="preconnect" href="https://api.tcgdex.net" crossorigin />
    <link rel="preconnect" href="https://assets.tcgdex.net" crossorigin />
    <!-- The mark: your six over theirs, the Team Preview screen abstracted.
         Kept byte-identical to `.brand::before` in app.css, which is the same
         artwork at header size. test/app/logo-mark.test.ts fails if they drift. -->
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%235B34D6'/><g fill='%23fff'><rect x='4' y='7' width='6' height='6' rx='1.5'/><rect x='13' y='7' width='6' height='6' rx='1.5'/><rect x='22' y='7' width='6' height='6' rx='1.5'/></g><g fill='none' stroke='%23fff' stroke-width='1.6' opacity='.85'><rect x='4.8' y='19.8' width='4.4' height='4.4' rx='1'/><rect x='13.8' y='19.8' width='4.4' height='4.4' rx='1'/><rect x='22.8' y='19.8' width='4.4' height='4.4' rx='1'/></g></svg>"
    />
    <title>Team Preview: draft, simulate, pressure-test</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
